{% extends 'guerreros_cf/base.html' %}
{% load static %}

{% block content %}

<div class="page-hero">
  <h1>{{ noticia.titulo }}</h1>
  <p>{{ noticia.get_categoria_display }}</p>
</div>

<div class="section">

  <div class="news-detail-card">

    {% if noticia.imagen %}
      <img src="{{ noticia.imagen.url }}" class="news-detail-img">
    {% endif %}

    <div class="news-detail-content">

      <div class="news-text">
        {{ noticia.contenido|linebreaks }}
      </div>

    </div>

  </div>

  <div style="margin-top:2rem; text-align:center;">
    <a href="{% url 'guerreros:noticias_lista' %}" class="btn-submit">
      ← Volver a noticias
    </a>
  </div>

</div>

<style>

.news-detail-card{
    max-width: 1000px;
    margin: 40px auto;
    background: #fff;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    border: 1px solid rgba(0,0,0,.08);
}

.news-detail-img{
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    display: block;
}

.news-detail-content{
    padding: 40px;
}

.news-meta{
    color: #d4af37;
    font-weight: 600;
    margin-bottom: 25px;
    font-size: 15px;
}

.news-text{
    color: #222;
    line-height: 1.9;
    font-size: 1.08rem;
}

.news-text p{
    margin-bottom: 20px;
}

.btn-submit{
    display: inline-block;
    background: #d4af37;
    color: #000;
    padding: 14px 30px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.btn-submit:hover{
    transform: translateY(-3px);
    background: #f1cb52;
}

@media(max-width:768px){

    .news-detail-card{
        margin: 20px;
    }

    .news-detail-content{
        padding: 25px;
    }

}

</style>

{% endblock %}
